name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Verificar sintaxe do backend e das regras
        run: npm run check

      - name: Executar análise estática
        run: npm run lint

      - name: Gerar build de produção
        run: npm run build

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
